name: Vorken CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore agent
        run: dotnet restore .\agent\Vorken.Agent.csproj -r win-x64

      - name: Build agent
        run: dotnet build .\agent\Vorken.Agent.csproj -c Release -r win-x64 --no-restore

      - name: Publish agent
        run: dotnet publish .\agent\Vorken.Agent.csproj -c Release -r win-x64 --self-contained true --no-restore -o .\publish

      - name: Generate SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\publish\Vorken.Agent.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Vorken.Agent.exe" | Set-Content -Encoding ascii .\publish\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Vorken-Agent-win-x64
          path: |
            .\publish\Vorken.Agent.exe
            .\publish\SHA256SUMS.txt
          retention-days: 30

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            .\publish\Vorken.Agent.exe
            .\publish\SHA256SUMS.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check server syntax
        run: node --check server.js

      - name: Check browser scripts
        run: |
          node --check public/admin.js
          node --check public/analysis.js
